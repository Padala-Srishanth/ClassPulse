[pytest]
# ClassPulse API — pytest configuration

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode for async tests (Phase 2+ will have async service tests)
asyncio_mode = auto

# Suppress deprecation warnings from third-party libs during tests
filterwarnings =
    ignore::DeprecationWarning:firebase_admin.*:
    ignore::DeprecationWarning:google.*:
    ignore::PendingDeprecationWarning

# Verbose output by default
addopts = -v --tb=short
